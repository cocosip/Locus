name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'feature/**'
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

env:
  DOTNET_VERSIONS: |
    8.0.x
    9.0.x
    10.0.x
  CONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSIONS }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Locus.slnx --verbosity minimal

    - name: Build solution
      run: dotnet build Locus.slnx --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

    - name: Run tests with coverage
      run: dotnet test Locus.slnx --configuration ${{ env.CONFIGURATION }} --no-build --verbosity minimal -m:1
        --collect:"XPlat Code Coverage"
        --results-directory ./coverage
        --logger "trx;LogFileName=test-results.trx"
        -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: '**/test-results.trx'
        retention-days: 7

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: ./coverage/**/coverage.cobertura.xml
        retention-days: 7

    - name: Extract version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "should_publish=true" >> $GITHUB_OUTPUT
        else
          VERSION="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "should_publish=false" >> $GITHUB_OUTPUT
        fi
        echo "Version: ${VERSION}"

  pack-nuget:
    name: Pack NuGet (Linux)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: needs.build-and-test.outputs.should_publish == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write # NuGet trusted publishing (GitHub OIDC -> short-lived nuget.org API key)

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSIONS }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Locus.slnx --verbosity minimal

    - name: Build solution
      run: dotnet build Locus.slnx --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

    - name: Pack NuGet packages
      run: |
        mkdir -p ./packages
        dotnet pack src/Locus/Locus.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-restore \
          --output ./packages \
          /p:PackageVersion=${{ needs.build-and-test.outputs.version }} \
          /p:ContinuousIntegrationBuild=true \
          --verbosity minimal
      shell: bash

    - name: Verify multi-target package
      run: |
        NUSPEC=$(unzip -p ./packages/Locus.*.nupkg '*.nuspec')
        for tfm in ".NETStandard2.0" "net8.0" "net9.0" "net10.0"; do
          grep -q "targetFramework=\"$tfm\"" <<< "$NUSPEC" || { echo "Missing dependency group: $tfm"; exit 1; }
        done
        unzip -l ./packages/Locus.*.nupkg | grep -E 'lib/(netstandard2\.0|net8\.0|net9\.0|net10\.0)/Locus\.dll'

    - name: List packages
      run: ls -la ./packages/

    - name: Verify NuGet packages exclude test artifacts
      run: |
        if unzip -l ./packages/*.nupkg | grep -Eiq '(^|/)(coverage|test-results)(/|$)|\.trx$|coverage\.cobertura\.xml$'; then
          echo "NuGet package contains test or coverage artifacts"
          exit 1
        fi

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
        retention-days: 30

    # Exchange the GitHub OIDC token for a short-lived (1h) nuget.org API key.
    # Requires a trusted publishing policy on nuget.org: cocosip / Locus / ci-cd.yml
    - name: NuGet login (OIDC -> temp API key)
      id: login
      uses: NuGet/login@v1
      with:
        user: virtual # nuget.org profile name (not email); public, so no secret is needed

    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./packages/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate \
          --no-symbols

    - name: Generate changelog
      id: changelog
      run: |
        PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

        if [ -z "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
        else
          CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
        fi

        echo "$CHANGELOG" > changelog.txt

        {
          echo 'CHANGELOG<<EOF'
          echo "$CHANGELOG"
          echo EOF
        } >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: Release v${{ needs.build-and-test.outputs.version }}
        tag_name: v${{ needs.build-and-test.outputs.version }}
        body: |
          ## 🚀 Release v${{ needs.build-and-test.outputs.version }}

          ### 📦 NuGet Package
          - **Locus** v${{ needs.build-and-test.outputs.version }}

          Built on: **Linux (ubuntu-latest)**

          ### 📝 Changes
          ${{ steps.changelog.outputs.CHANGELOG }}

          ### 🔗 Links
          - [NuGet Gallery](https://www.nuget.org/packages/Locus)
          - [Documentation](https://github.com/${{ github.repository }})
        files: ./packages/*.nupkg
        draft: false
        prerelease: ${{ contains(needs.build-and-test.outputs.version, '-') }}
        token: ${{ secrets.GITHUB_TOKEN }}

  pack-debug-symbols:
    name: Pack Debug Symbols
    runs-on: ubuntu-latest
    needs: [build-and-test, pack-nuget]
    if: needs.build-and-test.outputs.should_publish == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSIONS }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore and Build
      run: |
        dotnet restore Locus.slnx --verbosity minimal
        dotnet build Locus.slnx --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

    - name: Pack Symbol Packages
      run: |
        mkdir -p ./symbols
        dotnet pack src/Locus/Locus.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-restore \
          --output ./symbols \
          /p:PackageVersion=${{ needs.build-and-test.outputs.version }} \
          /p:ContinuousIntegrationBuild=true \
          --verbosity minimal

    - name: Upload Symbol Packages
      uses: actions/upload-artifact@v7
      with:
        name: symbol-packages
        path: ./symbols/*.snupkg
        retention-days: 30
