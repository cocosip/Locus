name: CI/CD Pipeline

# 与 obconnector-dotnet 共享同一套 CI/CD 约定：
#   push 默认分支(master) / PR -> master : 编译 + 测试
#   push 版本 tag（v2.1.0 或 2.1.0）    : 编译 + 测试 + 打包 + 发布 NuGet
# 其他分支（含 dev）不触发任何任务。
#
# 版本号唯一来源是 common.props 的 <Version>；tag 必须与之一致，
# 否则在编译之前就失败，包版本与 tag 不会漂移。
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
      - '*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  DOTNET_VERSIONS: |
    8.0.x
    9.0.x
    10.0.x
  CONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # 只编译一次：restore -> build -> test(--no-build) -> pack 复用同一份 Release 输出。
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      # 默认分支或版本 tag 的 push 才产出可发布包；PR 与手动运行只编译、测试。
      PACKAGE_BUILD: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSIONS }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Resolve version
      id: version
      run: |
        VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' common.props | head -n 1)
        if [ -z "$VERSION" ]; then
          echo "common.props does not define <Version>."
          exit 1
        fi
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag '$GITHUB_REF_NAME' must match common.props Version '$VERSION'."
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Tag '$GITHUB_REF_NAME' must point to HEAD."
            exit 1
          fi
          RELEASE=true
        else
          RELEASE=false
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
        echo "Version: ${VERSION} (release: ${RELEASE})"

    - name: Restore dependencies
      run: dotnet restore Locus.slnx --verbosity minimal

    - name: Build solution
      run: dotnet build Locus.slnx --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

    - name: Run tests with coverage
      run: |
        dotnet test Locus.slnx \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --verbosity minimal \
          -m:1 \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage \
          --logger "trx;LogFileName=test-results.trx" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: '**/test-results.trx'
        retention-days: 7

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: ./coverage/**/coverage.cobertura.xml
        retention-days: 7

    # 这里故意不加 --no-build：本包通过自定义 target 把 4 个子程序集嵌入包内，
    # 项目引用场景下 SDK 会因 NETSDK1085 拒绝 NoBuild=true；而
    # --no-build -p:BuildProjectReferences=false 能跑通但会静默丢掉子程序集的
    # .xml/.pdb（实测包体积从 1.65MB 降到 1.47MB）。增量检查约 3 秒，不重新编译。
    - name: Pack NuGet packages
      if: env.PACKAGE_BUILD == 'true'
      shell: bash
      run: |
        mkdir -p ./packages
        dotnet pack src/Locus/Locus.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-restore \
          --output ./packages \
          --verbosity minimal

    - name: Verify NuGet package contents
      if: env.PACKAGE_BUILD == 'true'
      shell: bash
      run: |
        NUSPEC=$(unzip -p ./packages/Locus.*.nupkg '*.nuspec')
        for tfm in ".NETStandard2.0" "net8.0" "net9.0" "net10.0"; do
          grep -q "targetFramework=\"$tfm\"" <<< "$NUSPEC" || { echo "Missing dependency group: $tfm"; exit 1; }
        done
        unzip -l ./packages/Locus.*.nupkg | grep -E 'lib/(netstandard2\.0|net8\.0|net9\.0|net10\.0)/Locus\.dll'
        ls ./packages/*.snupkg
        if unzip -l ./packages/*.nupkg | grep -Eiq '(^|/)(coverage|test-results)(/|$)|\.trx$|coverage\.cobertura\.xml$'; then
          echo "NuGet package contains test or coverage artifacts"
          exit 1
        fi
        ls -la ./packages/

    - name: Generate release notes
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        URL="https://github.com/${GITHUB_REPOSITORY}"
        PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --match '[0-9]*' HEAD^ 2>/dev/null || true)
        if [ -n "$PREVIOUS" ]; then
          COMPARISON="Changes since [${PREVIOUS}](${URL}/releases/tag/${PREVIOUS}). [Full changelog](${URL}/compare/${PREVIOUS}...${GITHUB_REF_NAME})."
        else
          COMPARISON="First release. [Commit history](${URL}/commits/${GITHUB_REF_NAME})."
        fi
        COMMIT_COUNT=$(git log --no-merges --oneline "${PREVIOUS:+${PREVIOUS}..}HEAD" | wc -l | tr -d ' ')
        {
          echo "# Locus ${{ steps.version.outputs.version }}"
          echo
          echo "## Packages"
          echo
          echo '```shell'
          echo "dotnet add package Locus --version ${{ steps.version.outputs.version }}"
          echo '```'
          echo
          echo "## Changes"
          echo
          echo "$COMPARISON"
          echo
          echo "${COMMIT_COUNT} commits (excluding merges)."
          echo
          git log --no-merges --format='- %h %s (%an)' "${PREVIOUS:+${PREVIOUS}..}HEAD"
          echo
          echo "See the [repository](${URL})."
        } > ./packages/RELEASE_NOTES.md

    - name: Upload verified packages and release notes
      if: env.PACKAGE_BUILD == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./packages/
        if-no-files-found: error
        retention-days: 30

  # 发布只消费构建产物：不 checkout 源码、不 restore、不编译。
  publish:
    name: Publish NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: needs.build-and-test.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write # required by NuGet trusted publishing (GitHub OIDC token)

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Download verified packages and release notes
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./packages

    # Trusted publishing: exchange this workflow's GitHub OIDC token for a
    # one-hour nuget.org API key. Requires a nuget.org trusted publishing
    # policy for cocosip/Locus / ci-cd.yml.
    - name: NuGet login (OIDC -> temporary API key)
      id: login
      uses: NuGet/login@v1
      with:
        user: virtual # nuget.org profile name (not email); public, so no secret is needed

    # 不传 --no-symbols：同目录的 .snupkg 会随 .nupkg 一起推送。
    - name: Publish packages to NuGet.org
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        test -s ./packages/RELEASE_NOTES.md
        for package in ./packages/*.nupkg; do
          test -s "$package"
          dotnet nuget push "$package" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done

    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ needs.build-and-test.outputs.version }}
      run: |
        flags=()
        if [[ "$VERSION" == *-* ]]; then
          flags+=(--prerelease --latest=false)
        fi
        gh release create "$GITHUB_REF_NAME" --verify-tag \
          --title "Locus $VERSION" \
          --notes-file ./packages/RELEASE_NOTES.md \
          "${flags[@]}" ./packages/*.nupkg ./packages/*.snupkg ./packages/RELEASE_NOTES.md
