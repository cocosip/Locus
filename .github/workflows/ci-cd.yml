name: CI/CD Pipeline

# 触发范围（dev 分支不触发任何任务）：
#   push master / PR -> master   : 编译 + 单元测试
#   push v*.*.* tag              : 编译 + 单元测试 + 打包 + 发布 NuGet
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSIONS: |
    8.0.x
    9.0.x
    10.0.x
  CONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # 全流程只编译一次：restore -> build -> test (--no-build) -> pack (复用同一份 Release 输出)
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSIONS }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Extract version
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
          RELEASE=true
        else
          VERSION="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          RELEASE=false
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
        echo "Version: ${VERSION} (release: ${RELEASE})"

    - name: Restore dependencies
      run: dotnet restore Locus.slnx --verbosity minimal

    - name: Build solution
      run: dotnet build Locus.slnx --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

    - name: Run tests with coverage
      run: |
        dotnet test Locus.slnx \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --verbosity minimal \
          -m:1 \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage \
          --logger "trx;LogFileName=test-results.trx" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: '**/test-results.trx'
        retention-days: 7

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: ./coverage/**/coverage.cobertura.xml
        retention-days: 7

    # 不传 --no-build：项目引用场景下 NetSDK 会拒绝 NoBuild=true；
    # 这里只是增量检查（实测约 3 秒，不发生重新编译），一次 pack 同时产出 .nupkg 与 .snupkg。
    - name: Pack NuGet packages
      if: steps.version.outputs.release == 'true'
      run: |
        mkdir -p ./packages
        dotnet pack src/Locus/Locus.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-restore \
          --output ./packages \
          /p:PackageVersion=${{ steps.version.outputs.version }} \
          --verbosity minimal
      shell: bash

    - name: Verify multi-target package
      if: steps.version.outputs.release == 'true'
      run: |
        NUSPEC=$(unzip -p ./packages/Locus.*.nupkg '*.nuspec')
        for tfm in ".NETStandard2.0" "net8.0" "net9.0" "net10.0"; do
          grep -q "targetFramework=\"$tfm\"" <<< "$NUSPEC" || { echo "Missing dependency group: $tfm"; exit 1; }
        done
        unzip -l ./packages/Locus.*.nupkg | grep -E 'lib/(netstandard2\.0|net8\.0|net9\.0|net10\.0)/Locus\.dll'
        ls ./packages/*.snupkg

    - name: Verify NuGet packages exclude test artifacts
      if: steps.version.outputs.release == 'true'
      run: |
        if unzip -l ./packages/*.nupkg | grep -Eiq '(^|/)(coverage|test-results)(/|$)|\.trx$|coverage\.cobertura\.xml$'; then
          echo "NuGet package contains test or coverage artifacts"
          exit 1
        fi

    - name: List packages
      if: steps.version.outputs.release == 'true'
      run: ls -la ./packages/

    - name: Upload NuGet packages
      if: steps.version.outputs.release == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          ./packages/*.nupkg
          ./packages/*.snupkg
        retention-days: 30

  # 发布只消费上面的产物：不 checkout 源码、不 restore、不编译。
  publish:
    name: Publish NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: needs.build-and-test.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write # NuGet trusted publishing (GitHub OIDC -> short-lived nuget.org API key)

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./packages

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Exchange the GitHub OIDC token for a short-lived (1h) nuget.org API key.
    # Requires a trusted publishing policy on nuget.org: cocosip / Locus / ci-cd.yml
    - name: NuGet login (OIDC -> temp API key)
      id: login
      uses: NuGet/login@v1
      with:
        user: virtual # nuget.org profile name (not email); public, so no secret is needed

    # 不传 --no-symbols：同一目录下的 .snupkg 会随 .nupkg 一起推送。
    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./packages/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Generate changelog
      id: changelog
      run: |
        PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

        if [ -z "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
        else
          CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
        fi

        echo "$CHANGELOG" > changelog.txt

        {
          echo 'CHANGELOG<<EOF'
          echo "$CHANGELOG"
          echo EOF
        } >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: Release v${{ needs.build-and-test.outputs.version }}
        tag_name: v${{ needs.build-and-test.outputs.version }}
        body: |
          ## 🚀 Release v${{ needs.build-and-test.outputs.version }}

          ### 📦 NuGet Package
          - **Locus** v${{ needs.build-and-test.outputs.version }}

          Built on: **Linux (ubuntu-latest)**

          ### 📝 Changes
          ${{ steps.changelog.outputs.CHANGELOG }}

          ### 🔗 Links
          - [NuGet Gallery](https://www.nuget.org/packages/Locus)
          - [Documentation](https://github.com/${{ github.repository }})
        files: |
          ./packages/*.nupkg
          ./packages/*.snupkg
        draft: false
        prerelease: ${{ contains(needs.build-and-test.outputs.version, '-') }}
        token: ${{ secrets.GITHUB_TOKEN }}
